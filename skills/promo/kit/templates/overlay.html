<!doctype html>
<!-- UGC kit: the phone playing the real feature on a TRANSPARENT background, to lay over creator footage.
     Render with --format mov (ProRes 4444 + alpha) and --format webm (VP9 + alpha). 1080x1920, 12 s. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Phone overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="kit/promo.css" />
    <style>
      html,
      body {
        background: transparent;
      }
      #root {
        background: transparent;
      }
      #phone {
        --w: 600px;
        left: 240px;
        top: 330px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="overlay" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="phone" class="phone">
        <div class="phone-screen">
          <video id="o1" class="fill" src="assets/S2.mp4" muted playsinline data-start="0" data-duration="6" data-media-start="3.0"></video>
          <video id="o2" class="fill" src="assets/S1.mp4" muted playsinline data-start="6" data-duration="6" data-media-start="3.4"></video>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Pops in, floats gently, so an editor can cut it anywhere.
      tl.fromTo("#phone", { opacity: 0, y: 120, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.to("#phone", { y: -16, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.6);
      window.__timelines["overlay"] = tl;
    </script>
  </body>
</html>
